name: Run test suite

on:
    push:
        branches:
            - dev

    pull_request:
        branches:
            - main

    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build Docker Image
              run: docker build -t test-img .

            - name: Run tests within a Container
              run: docker run test-img

