name: Run test suite

on:

    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout repository
              run: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 18

            - name: Install Dependencies
              run: npm install

            - name: Install Jest 
              run: npm install jest

            - name: Run Tests
              run: npm test
